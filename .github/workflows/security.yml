# ══════════════════════════════════════════════════════════════════════════════
# Example: security pipeline for a regular project.
#
# Copy this to your repo's .github/workflows/security.yml and adjust the
# placeholders. All four controls are enabled but advisory (blocking: false)
# and schedule-only (weekly, not on every PR) by default - they report
# findings without failing the build, to keep Actions minutes down and avoid
# blocking merges while a repo's backlog of existing findings gets triaged.
# Flip blocking to true and/or schedule_only to false per control once it's
# proven quiet enough to enforce. Set install_cmd on SCA to match your repo's
# dependency install so Syft resolves them. License scanning (ORT) ships with
# a default copyleft/unhandled-license policy - see docs/license.md before
# relying on it, since an unfamiliar license just missing from the
# classification file looks the same as a real violation. SonarQube and the
# Protocol Fuzzer are included below but commented out: uncomment and fill in
# the placeholders only for repos that actually need that extra coverage.
#
# ── Enabling/disabling a control ─────────────────────────────────────────────
# Every job below is ALWAYS present in this file - never comment a job out.
# `summary` at the bottom `needs:` all four by name, and a job that vanishes
# from the file makes the ENTIRE workflow invalid (not just that job), so
# every push fails with "depends on unknown job 'x'" before anything even
# runs. To turn a control off, flip its `enabled:` line to `false` instead:
#
#   sast:
#     with:
#       enabled: false   # <- disabled
#
# The job stays defined (so `needs:` below stays valid) but never runs, and
# `summary` shows it as "Disabled".
#
# `schedule_only: true/false` on each job controls whether it runs on every
# PR (false) or only on the schedule/workflow_dispatch triggers below
# (true) - same knob SCA already uses, now on SAST and Secrets too.
# ══════════════════════════════════════════════════════════════════════════════

name: Security

on:
  pull_request:
    branches: [main, master]   # only PRs targeting a default branch - not e.g. feature-into-feature
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 2 * * 0"  # weekly, Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read          # modules' upload-sarif / sbom-action read the run
  issues: write         # every module opens a GitHub Issue on any finding, regardless of blocking status
  pull-requests: write  # SonarQube PR decoration, if enabled

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── SAST - Semgrep (enabled, advisory - reports MEDIUM+, does not block) ────
  sast:
    name: "SAST · Semgrep"
    uses: nauralab-io/security/.github/workflows/sast.yml@main
    with:
      enabled: true             # set to false to disable this control - see note at top of file
      severity: MEDIUM          # report MEDIUM/HIGH/CRITICAL findings - LOW/INFO stay excluded
      block_severity: CRITICAL  # but only fail the job on a CRITICAL finding - MEDIUM/HIGH stay visible, non-blocking
      # Diff-aware scan on PRs: only findings introduced since the PR's base
      # commit are reported, instead of re-scanning the whole repo on every
      # commit. Empty (full scan) on non-PR triggers (schedule/dispatch),
      # since github.event.pull_request is unset there.
      baseline_ref: ${{ github.event.pull_request.base.sha }}
      # Gitleaks already catches hardcoded private keys - drop Semgrep's own
      # copy of that check so the same finding isn't triaged twice.
      exclude_rules: "generic.secrets.security.detected-private-key.detected-private-key"
      blocking: false
      schedule_only: true       # true = only run on the schedule/workflow_dispatch triggers above, not every PR
      # Mirrors every finding into the org's Security Findings Registry in
      # Notion (Quality teamspace) - see docs/security-registry.md. Leave
      # unset to skip; also needs the NOTION_TOKEN secret set.
      # notion_database_id: ${{ vars.SECURITY_REGISTRY_DATABASE_ID }}
    # Required: forwards whatever secrets sast.yml needs (e.g. SEMGREP_APP_TOKEN)
    # without this repo having to know its internal secret names - the module
    # itself is versioned and trusted.
    secrets: inherit  # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit

  # ── Secrets - Gitleaks (enabled, advisory - does not block on a leak) ───────
  secrets:
    name: "Secrets · Gitleaks"
    uses: nauralab-io/security/.github/workflows/secrets.yml@main
    with:
      enabled: true          # set to false to disable this control - see note at top of file
      blocking: false         # fails the job - and blocks merge - if any secret is found
      schedule_only: true    # true = only run on the schedule/workflow_dispatch triggers above, not every PR
      # notion_database_id: ${{ vars.SECURITY_REGISTRY_DATABASE_ID }}   # see notion_database_id note on the sast job above
    # Required: forwards whatever secrets secrets.yml needs - the module
    # itself is versioned and trusted.
    secrets: inherit  # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit

  # ── SCA - Grype + Syft (enabled, schedule-only) ─────────────────────────────
  sca:
    name: "SCA · Grype"
    uses: nauralab-io/security/.github/workflows/sca.yml@main
    with:
      enabled: true        # set to false to disable this control - see note at top of file
      fail_on: critical
      blocking: false
      schedule_only: true  # true = only run on the schedule/workflow_dispatch triggers above, not every PR
      # install_cmd: "pip install -r requirements.txt"   # adjust to your repo's dependency install so Syft resolves them
      # notion_database_id: ${{ vars.SECURITY_REGISTRY_DATABASE_ID }}   # see notion_database_id note on the sast job above
    secrets: inherit  # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit

  # ── License - ORT (enabled, advisory - copyleft/unhandled licenses flagged, does not block) ───
  license:
    name: "License · ORT"
    uses: nauralab-io/security/.github/workflows/license.yml@main
    with:
      enabled: true        # set to false to disable this control - see note at top of file
      blocking: false
      schedule_only: true  # true = only run on the schedule/workflow_dispatch triggers above, not every PR - ORT's analyzer resolves the full dependency tree, heavier than a lock-file read
      # ort_config_path: ".ort"   # point at your own rules.kts/license-classifications.yml instead of the shared default policy
      # notion_database_id: ${{ vars.SECURITY_REGISTRY_DATABASE_ID }}   # see notion_database_id note on the sast job above
    secrets: inherit  # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit

  # ── SAST - SonarQube (present, disabled by default - uncomment to enable) ───
  # sonar:
  #   name: "SAST · SonarQube"
  #   uses: nauralab-io/security/.github/workflows/sonar.yml@main
  #   with:
  #     project_key: "nauralab-io_<your-repo-name>"   # required
  #     organization: "nauralab-io"
  #     quality_gate: true
  #     blocking: false   # start advisory while the project is first analysed
  #   secrets: inherit   # needs SONAR_TOKEN configured as a repo/org secret

  # ── Fuzzing - Protocol Fuzzer (present, disabled by default) ────────────────
  # Only relevant for repos testing a non-HTTP protocol (binary/TLS framing) -
  # see docs/protocol-fuzz.md before enabling.
  # protocol-fuzz:
  #   name: "Fuzzing · Protocol Fuzzer"
  #   uses: nauralab-io/security/.github/workflows/protocol-fuzz.yml@main
  #   with:
  #     compose_file: "path/to/docker-compose.fuzz.yml"   # required - see docs/protocol-fuzz.md
  #     target_host: "127.0.0.1"
  #     target_port: 0000
  #     test_directory: "path/to/fuzz/suite"
  #     blocking: false      # start advisory while the suite is first baselined
  #     schedule_only: true  # a full fuzz run is slow - nightly/on-demand instead of every PR
  #   secrets:
  #     registry_token: ${{ secrets.PACKAGES_READ_TOKEN }}   # only if the build needs a private registry token

  # ── Overall roll-up: one combined summary across the enabled controls ────────
  # `needs:` names all four jobs above by their fixed id - they must always
  # stay defined (see "Enabling/disabling a control" at the top of this file).
  # If you enable SonarQube/Fuzzer above, add that job here too and echo a
  # matching row below.
  #
  # Every control above defaults to schedule_only: true, so by default there's
  # nothing to summarize on a PR run - every row would just read "skipped".
  # This job is gated the same way as a result. If you flip any control's
  # schedule_only to false, revisit this condition (e.g. drop it back to a
  # plain `always()`) so that control's result still posts on a PR.
  summary:
    name: "Security · Summary"
    needs: [sast, secrets, sca, license]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Write overall security summary
        # Values via env, never inlined into the script (shell-injection-safe).
        # ENABLED mirrors each job's own `with: enabled:` above - keep them in
        # sync when you flip one.
        env:
          SAST_ENABLED: true
          SAST_RESULT: ${{ needs.sast.result }}
          SAST_FINDINGS: ${{ needs.sast.outputs.findings_count }}
          SAST_BLOCKING: ${{ needs.sast.outputs.blocking_count }}
          SECRETS_ENABLED: true
          SECRETS_RESULT: ${{ needs.secrets.result }}
          SECRETS_LEAKS: ${{ needs.secrets.outputs.leaks_count }}
          SCA_ENABLED: true
          SCA_RESULT: ${{ needs.sca.result }}
          SCA_TOTAL: ${{ needs.sca.outputs.total_findings }}
          SCA_NEW: ${{ needs.sca.outputs.new_findings }}
          LICENSE_ENABLED: true
          LICENSE_RESULT: ${{ needs.license.result }}
          LICENSE_VIOLATIONS: ${{ needs.license.outputs.violations_count }}
          LICENSE_BLOCKING: ${{ needs.license.outputs.blocking_count }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "⚪";; esac; }
          # $1=enabled ("true"/"false") $2=result $3=label $4=findings detail
          row() {
            if [ "$1" != "true" ]; then
              echo "| $3 | ⏸️ Disabled | - |"
            else
              echo "| $3 | $(icon "$2") \`${2}\` | $4 |"
            fi
          }
          {
            echo "## 🛡️ Security scan summary"
            echo ""
            echo "| Control | Result | Findings |"
            echo "|---------|--------|----------|"
            row "$SAST_ENABLED" "$SAST_RESULT" "SAST · Semgrep" "${SAST_FINDINGS:-0} reported, ${SAST_BLOCKING:-0} blocking"
            row "$SECRETS_ENABLED" "$SECRETS_RESULT" "Secrets · Gitleaks" "${SECRETS_LEAKS:-0} leak(s)"
            row "$SCA_ENABLED" "$SCA_RESULT" "SCA · Grype" "${SCA_TOTAL:-0} CVE(s)${SCA_NEW:+, ${SCA_NEW} new}"
            row "$LICENSE_ENABLED" "$LICENSE_RESULT" "License · ORT" "${LICENSE_VIOLATIONS:-0} violation(s), ${LICENSE_BLOCKING:-0} blocking"
            echo ""
            echo "Per-tool detail is in each job above. Findings are also filed as GitHub issues (one per author, deduped)."
          } >> "$GITHUB_STEP_SUMMARY"

# ── PR cleanup (recommended companion, separate file) ─────────────────────────
# Issues opened against a PR are labelled `pr-<N>`. When that PR closes they'd
# otherwise stay open forever - add examples/pr-cleanup.yml (a standalone
# workflow on the pull_request:closed event) to close them automatically.
# It can't live in this file: this one triggers on opened/synchronize/reopened,
# that one on closed.
